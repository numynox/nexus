<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-label="A modern train">
  <!-- track -->
  <rect x="0" y="128" width="360" height="4" rx="2" fill="var(--il-rail, #12313A)" opacity="0.85"/>
  <g fill="var(--il-rail, #12313A)" opacity="0.3">
    <rect x="8" y="134" width="22" height="4" rx="2"/><rect x="44" y="134" width="22" height="4" rx="2"/>
    <rect x="80" y="134" width="22" height="4" rx="2"/><rect x="116" y="134" width="22" height="4" rx="2"/>
    <rect x="152" y="134" width="22" height="4" rx="2"/><rect x="188" y="134" width="22" height="4" rx="2"/>
    <rect x="224" y="134" width="22" height="4" rx="2"/><rect x="260" y="134" width="22" height="4" rx="2"/>
    <rect x="296" y="134" width="22" height="4" rx="2"/><rect x="332" y="134" width="22" height="4" rx="2"/>
  </g>
  <!-- bogies -->
  <g fill="var(--il-rail, #12313A)">
    <rect x="34" y="112" width="58" height="12" rx="6"/>
    <rect x="232" y="112" width="58" height="12" rx="6"/>
    <circle cx="48" cy="124" r="6"/><circle cx="78" cy="124" r="6"/>
    <circle cx="246" cy="124" r="6"/><circle cx="276" cy="124" r="6"/>
  </g>
  <g fill="var(--il-sky, #CFE6F2)">
    <circle cx="48" cy="124" r="2"/><circle cx="78" cy="124" r="2"/>
    <circle cx="246" cy="124" r="2"/><circle cx="276" cy="124" r="2"/>
  </g>
  <!-- body -->
  <path d="M22 30 H250 C290 30 322 52 336 86 L340 98 C342 106 337 114 328 114 H22 C15 114 10 109 10 102 V42 C10 35 15 30 22 30 Z" fill="var(--il-white, #FFFFFF)"/>
  <!-- green lower half -->
  <path d="M10 82 H331 L336 94 L340 98 C342 106 337 114 328 114 H22 C15 114 10 109 10 102 Z" fill="var(--il-green, #1F6F5C)"/>
  <!-- amber pinstripe -->
  <path d="M10 78 H329 L331 82 H10 Z" fill="var(--il-amber, #F2B84B)"/>
  <!-- window band -->
  <rect x="24" y="44" width="230" height="22" rx="7" fill="var(--il-ink, #12313A)"/>
  <g fill="var(--il-sky, #CFE6F2)" opacity="0.9">
    <rect x="30" y="48" width="34" height="14" rx="4"/>
    <rect x="70" y="48" width="34" height="14" rx="4"/>
    <rect x="128" y="48" width="34" height="14" rx="4"/>
    <rect x="168" y="48" width="34" height="14" rx="4"/>
    <rect x="208" y="48" width="40" height="14" rx="4"/>
  </g>
  <!-- door -->
  <rect x="108" y="40" width="16" height="70" rx="4" fill="none" stroke="var(--il-ink, #12313A)" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="111" y="46" width="10" height="18" rx="3" fill="var(--il-ink, #12313A)" opacity="0.8"/>
  <!-- cab windscreen -->
  <path d="M266 40 H286 C302 42 316 52 324 66 H274 C269 66 266 63 266 58 Z" fill="var(--il-ink, #12313A)"/>
  <path d="M276 46 H288 C298 48 306 54 311 60 H276 Z" fill="var(--il-sky, #CFE6F2)" opacity="0.35"/>
  <!-- headlight -->
  <ellipse cx="331" cy="96" rx="5" ry="3.5" fill="var(--il-amber, #F2B84B)"/>
  <!-- roof details -->
  <rect x="60" y="24" width="40" height="6" rx="3" fill="var(--il-rail, #12313A)" opacity="0.7"/>
  <rect x="180" y="24" width="56" height="6" rx="3" fill="var(--il-rail, #12313A)" opacity="0.7"/>
</svg>
