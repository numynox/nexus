name: Abeona Android

# Builds the native Abeona app (android-app.yml), only when its own code or the
# shared Android code changes. Keep this file's name: its run number is the
# app's version code, and a renamed workflow would start counting from one.

on:
  push:
    branches: [main]
    paths:
      - "android/abeona/**"
      - "android/core/**"
      - "android/build-logic/**"
      - "android/gradle/**"
      - "android/*.kts"
      - "android/gradle.properties"
      - "android/gradlew"
      - "config.yaml"
      - ".github/workflows/android-abeona.yml"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android/abeona/**"
      - "android/core/**"
      - "android/build-logic/**"
      - "android/gradle/**"
      - "android/*.kts"
      - "android/gradle.properties"
      - "android/gradlew"
      - "config.yaml"
      - ".github/workflows/android-abeona.yml"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-abeona-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/android-app.yml
    with:
      app: abeona
      title: Abeona
    secrets: inherit
