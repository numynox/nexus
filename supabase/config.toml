
[functions.fetch-rss]
enabled = true
verify_jwt = false
import_map = "./functions/fetch-rss/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/fetch-rss/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/fetch-rss/*.html" ]

[functions.refresh-fuel-prices]
enabled = true
verify_jwt = false
import_map = "./functions/refresh-fuel-prices/deno.json"
entrypoint = "./functions/refresh-fuel-prices/index.ts"

# Called from Vibilia's UI with the signed-in user's JWT, which the function
# re-checks with auth.getUser(). Unlike the two scheduled functions above, it is
# not guarded by a shared secret, so JWT verification must stay on.
[functions.fetch-nearby-fuel-prices]
enabled = true
verify_jwt = true
entrypoint = "./functions/fetch-nearby-fuel-prices/index.ts"

# Called from Annona's scanner with the signed-in user's JWT, which the function
# re-checks with auth.getUser(). Like fetch-nearby-fuel-prices, it runs as the
# caller rather than behind a shared secret.
[functions.lookup-food-product]
enabled = true
verify_jwt = true
entrypoint = "./functions/lookup-food-product/index.ts"

# Abeona's station search, journey search and live refresh, called from both
# clients with the signed-in user's JWT, which the function re-checks with
# auth.getUser(). Like lookup-food-product, it runs as the caller.
[functions.abeona-transit]
enabled = true
verify_jwt = true
entrypoint = "./functions/abeona-transit/index.ts"

# Abeona's final snapshot, run by pg_cron every 15 minutes through
# public.invoke_abeona_refresh_trips(). Like fetch-rss it is guarded by a
# shared secret (ABEONA_REFRESH_INVOKE_SECRET) and uses the service role, so
# JWT verification is off.
[functions.abeona-refresh-trips]
enabled = true
verify_jwt = false
entrypoint = "./functions/abeona-refresh-trips/index.ts"

# Abeona's imports (Träwelling for now), called from both clients with the
# signed-in user's JWT, re-checked with auth.getUser(). The Träwelling token
# travels in the request body and is never stored.
[functions.abeona-import]
enabled = true
verify_jwt = true
entrypoint = "./functions/abeona-import/index.ts"

# Abeona's share links (.ics and the status page's JSON), opened by anyone
# holding the link: no JWT. The unguessable token is the credential, looked
# up with the service role through abeona_shared_trip(), which opens only a
# trip's route and times, and nothing after the link expires
# (decisions/2026-11-04-abeona-share-links.md).
[functions.abeona-public]
enabled = true
verify_jwt = false
entrypoint = "./functions/abeona-public/index.ts"
